name: Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (for example v1.0.0)
        required: true
        type: string
      publish:
        description: Update TrayNook/homebrew-tap after checks pass
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  check:
    name: Verify release and cask
    if: >-
      github.repository == 'TrayNook/traynook' &&
      (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.release_version }}
      source_commit: ${{ steps.source.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record the checked automation commit
        id: source
        run: printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require a public stable release from a verified tag
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          metadata=$(Scripts/release-metadata.sh "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo '::error::The Homebrew cask accepts stable releases only.'
            exit 1
          fi
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" != false ]]; then
            echo '::error::Homebrew requires publicly downloadable release assets.'
            exit 1
          fi
          published_tag=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName')
          if [[ "$published_tag" != "$RELEASE_TAG" ]]; then
            echo '::error::The tag must have a published stable GitHub release.'
            exit 1
          fi
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '.object | select(.type == "tag") | .sha')
          if [[ -z "$tag_object" ]]; then
            echo '::error::Release tags must be signed annotated tags.'
            exit 1
          fi
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" \
            --jq 'select(.verification.verified == true and .object.type == "commit") | .object.sha')
          if [[ ! "$tag_commit" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::GitHub must verify the release tag signature and commit.'
            exit 1
          fi
          git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"
          printf '%s\n' "$metadata" >> "$GITHUB_OUTPUT"
      - name: Download release assets and generate latest and versioned casks
        env:
          VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/cask"
          archive="TrayNook-$VERSION.zip"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --pattern "$archive.sha256" --dir "$RUNNER_TEMP/release"
          python3 Scripts/homebrew-cask.py --version "$VERSION" \
            --archive "$RUNNER_TEMP/release/$archive" \
            --checksum "$RUNNER_TEMP/release/$archive.sha256" \
            --output "$RUNNER_TEMP/cask/traynook.rb"
          python3 Scripts/homebrew-cask.py --version "$VERSION" \
            --archive "$RUNNER_TEMP/release/$archive" \
            --checksum "$RUNNER_TEMP/release/$archive.sha256" \
            --output "$RUNNER_TEMP/cask/traynook@$VERSION.rb" --versioned
      - name: Check Homebrew style, audit, installation, and app signature
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          brew tap-new --no-git traynook/ci
          tap_path=$(brew --repository traynook/ci)
          mkdir -p "$tap_path/Casks"
          cp "$RUNNER_TEMP/cask/traynook.rb" "$RUNNER_TEMP/cask/traynook@$VERSION.rb" "$tap_path/Casks/"
          brew trust --tap traynook/ci
          brew style --cask traynook/ci/traynook "traynook/ci/traynook@$VERSION"
          for token in traynook "traynook@$VERSION"; do
            # The built-in conflict audit clones all of homebrew/core.
            status=$(curl --silent --show-error --location --retry 3 \
              --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' \
              "https://formulae.brew.sh/api/formula/$token.json")
            case "$status" in
              404) ;;
              200) echo "::error::The $token token conflicts with a core formula."; exit 1 ;;
              *) echo "::error::Formula conflict check failed with HTTP $status."; exit 1 ;;
            esac
            brew audit --cask --strict --except token_conflicts "traynook/ci/$token"
            # Both casks install TrayNook.app, so test them one at a time.
            brew install --cask "traynook/ci/$token"
            codesign --verify --deep --strict "/Applications/TrayNook.app"
            distribution=$(plutil -extract TrayNookDistribution raw "/Applications/TrayNook.app/Contents/Info.plist")
            case "$distribution" in
              adhoc)
                codesign --display --verbose=2 "/Applications/TrayNook.app" 2>&1 | grep -qx 'Signature=adhoc'
                ;;
              notarized)
                spctl --assess --type execute "/Applications/TrayNook.app"
                xcrun stapler validate "/Applications/TrayNook.app"
                ;;
              *) echo '::error::Unknown distribution mode in the release app.'; exit 1 ;;
            esac
            brew uninstall --cask "traynook/ci/$token"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-release
          path: |
            ${{ runner.temp }}/cask/
            ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Update tap repository
    needs: check
    if: >-
      github.event_name == 'release' ||
      (inputs.publish && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: homebrew
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.source_commit }}
          path: source
          persist-credentials: false
      - name: Require the tap credential
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo '::error::Set HOMEBREW_TAP_TOKEN in the homebrew environment.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          repository: TrayNook/homebrew-tap
          ref: master
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - uses: actions/download-artifact@v8
        with:
          name: homebrew-release
          path: generated
      - name: Prevent downgrades and changes to release history
        run: |
          python3 source/Scripts/homebrew-cask.py --version "$VERSION" \
            --archive "generated/release/TrayNook-$VERSION.zip" \
            --checksum "generated/release/TrayNook-$VERSION.zip.sha256" \
            --output candidate/traynook.rb --current-cask tap/Casks/traynook.rb
          python3 source/Scripts/homebrew-cask.py --version "$VERSION" \
            --archive "generated/release/TrayNook-$VERSION.zip" \
            --checksum "generated/release/TrayNook-$VERSION.zip.sha256" \
            --output "candidate/traynook@$VERSION.rb" \
            --current-cask "tap/Casks/traynook@$VERSION.rb" --versioned
          cmp candidate/traynook.rb generated/cask/traynook.rb
          cmp "candidate/traynook@$VERSION.rb" "generated/cask/traynook@$VERSION.rb"
      - name: Commit the verified latest and versioned casks
        working-directory: tap
        run: |
          mkdir -p Casks
          cp ../candidate/traynook.rb "../candidate/traynook@$VERSION.rb" Casks/
          git add -- Casks/traynook.rb "Casks/traynook@$VERSION.rb"
          if git diff --cached --quiet; then
            echo 'The Homebrew tap already has these casks.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update TrayNook to $VERSION"
          git push origin HEAD:master
